[project]
name = "multi-agent-prototype"
version = "0.1.0"
description = "A dependency-light orchestrator/workers coding-agent prototype with a ChatGPT-style web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.14.22",
    "llama-index-llms-openai>=0.7.9",
]

[project.scripts]
multi-agent = "app.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*", "tools*"]
exclude = ["generated_projects*"]
